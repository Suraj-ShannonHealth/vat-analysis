# Deploy VAT Analysis (VAT Approval Form) to vsauto3
# App path: /home/suraj/projects/vat-analysis
# PM2 name: vat-analysis
#
# GitHub secrets:
#   ADMIN_PASSWORD  (required)
#   ADMIN_USERNAME  (optional, default: admin)
#
name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vat-analysis
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./vat_prod.db"

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: "file:./vat_prod.db"

      - name: Deploy to server
        env:
          APP_DIR: /home/suraj/projects/vat-analysis
          ECOSYSTEM: /home/suraj/projects/ecosystem.config.js
          PM2_NAME: vat-analysis
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "ERROR: GitHub secret ADMIN_PASSWORD is not set."
            exit 1
          fi

          ADMIN_USER="${ADMIN_USERNAME:-admin}"

          echo "==> Target: $APP_DIR (PM2: $PM2_NAME)"
          mkdir -p "$APP_DIR/public/files"
          mkdir -p "$APP_DIR/prisma"

          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.next/cache' \
            --exclude 'public/files/**' \
            --exclude 'prisma/dev.db' \
            --exclude 'prisma/dev.db-journal' \
            --exclude 'prisma/vat_prod.db' \
            --exclude 'prisma/vat_prod.db-journal' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env*.local' \
            ./ "$APP_DIR/"

          # printf avoids YAML/heredoc issues
          printf '%s\n' \
            "DATABASE_URL=\"file:./vat_prod.db\"" \
            "ADMIN_USERNAME=\"${ADMIN_USER}\"" \
            "ADMIN_PASSWORD=\"${ADMIN_PASSWORD}\"" \
            "NODE_ENV=production" \
            "PORT=3010" \
            > "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"
          echo "==> .env written"

          cd "$APP_DIR"

          echo "==> npm ci (production)"
          npm ci --omit=dev --legacy-peer-deps

          echo "==> prisma generate + db push"
          npx prisma generate
          npx prisma db push --skip-generate

          echo "==> PM2"
          if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_NAME" --update-env
          else
            if [ -f "$ECOSYSTEM" ] && grep -q "$PM2_NAME" "$ECOSYSTEM" 2>/dev/null; then
              pm2 start "$ECOSYSTEM" --only "$PM2_NAME"
            else
              echo "==> No ecosystem entry for $PM2_NAME — starting directly"
              pm2 start npm --name "$PM2_NAME" --cwd "$APP_DIR" -- start
            fi
            pm2 save
          fi

          pm2 status "$PM2_NAME" || true
          echo "==> Deploy complete → http://172.16.11.138:3010"